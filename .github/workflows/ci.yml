# CI Unit Economics — periksa, bangun, uji di layar, lalu kirim ke live.
#
# Empat job, dan urutannya bukan selera:
#
#   cepat   → lint, typecheck, probe node        (~2 mnt, gagal paling awal)
#   bundel  → next build, out/ jadi artifact     (~3 mnt)
#   layar   → serve:build + probe browser        (~4 mnt)
#   kirim   → out/ → repo portfolio → abbas.co.id/perfume  (HANYA push ke main)
#
# `cepat` ada supaya kesalahan yang bisa ditemukan dalam dua menit tidak menunggu
# sembilan menit. `layar` memakai artifact dari `bundel`, bukan membangun ulang —
# membangun dua kali membuka celah dua job menguji bundle yang berbeda.
#
# ## Yang TIDAK dihafal di berkas ini
#
# Daftar probe. Daftar nama yang ditulis tangan akan jadi basi tanpa ada yang
# sadar, dan CI yang hijau karena tidak menjalankan ujinya lebih buruk daripada
# tidak ada CI — ia memberi rasa aman yang tidak dibayar apa pun.
# `scripts/jalankan-probe.mjs` MENEMUKAN probenya dari isi folder, jadi menambah
# berkas `probe-*.mjs` otomatis menambahkannya ke CI.
#
# ## Peringatan soal job `kirim`
#
# Ia mendorong commit ke repo portfolio, dan push itu memicu webhook Hostinger →
# **abbas.co.id/perfume langsung berubah.** Ia hanya jalan pada push ke `main`,
# hanya kalau ketiga job di atasnya hijau, dan butuh secret `PORTFOLIO_PUSH_TOKEN`
# yang harus dibuat manual. Cara mematikannya, dan cara membuat PAT-nya, ada di
# docs/CI-CD.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push berturut-turut ke branch yang sama membatalkan jalan sebelumnya. Tanpa
# ini, dua deploy bisa berlomba dan yang menang belum tentu yang terbaru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Satu-satunya tempat URL server uji ditulis. Probe menerimanya lewat argv.
  URL_UJI: http://localhost:4880/perfume-app

jobs:
  # ─────────────────────────────────────────────────────────── 1. cepat ──
  cepat:
    name: Lint, typecheck, probe data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Probe yang tidak butuh browser. Termasuk probe:hitung, yang menjaga tiap
      # angka yang dibawa ke rapat — ia jalan dalam sepersekian detik justru
      # karena `src/bersama` dan `src/contexts/*/domain` bebas framework dan
      # bebas jaringan (ditegakkan probe:arsitektur).
      #
      # ⚠️ Kredensial diberikan di sini KHUSUS untuk `probe:rls`, yang menembak
      # project Supabase sungguhan. Tanpa keduanya probe itu melaporkan dirinya
      # DILEWATI di lokal — tapi di CI ia menolak dilewati dan gagal, karena
      # probe yang bisa melewati dirinya sendiri di CI tidak menjaga apa pun.
      #
      # `CI` dibaca probe-rls untuk membedakan kedua perilaku itu; GitHub Actions
      # memang sudah menyetelnya, dan ditulis ulang di sini supaya keterikatannya
      # terlihat dari berkas ini.
      - name: Probe data
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DOKUMEN_ID: ${{ vars.NEXT_PUBLIC_DOKUMEN_ID }}
        run: npm run probe:data

  # ────────────────────────────────────────────────────────── 2. bundel ──
  bundel:
    name: Build export statis
    runs-on: ubuntu-latest
    needs: [cepat]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # ⚠️ Kredensial datang dari `vars`, BUKAN `secrets`, dan itu keputusan yang
      # sadar. Anon key Supabase memang dirancang sampai ke browser — ia sudah
      # ada di dalam bundle publik yang dihasilkan langkah ini, apa pun caranya
      # dimasukkan. Menyimpannya sebagai secret cuma menyembunyikannya dari
      # orang yang membaca log CI, bukan dari orang yang membuka halamannya, dan
      # kerahasiaan yang bohong lebih buruk daripada tidak ada.
      #
      # Yang MENJAGA datanya RLS. Lihat docs/INFRASTRUKTUR.md.
      #
      # `SUPABASE_SERVICE_ROLE_KEY` tidak boleh muncul di sini dalam bentuk apa
      # pun: ia melewati SELURUH RLS, dan langkah ini menuliskan lingkungannya
      # ke dalam berkas yang dipublikasikan.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DOKUMEN_ID: ${{ vars.NEXT_PUBLIC_DOKUMEN_ID }}
        run: npm run build

      # Bundle yang kehilangan kredensial tetap jalan — dalam **mode lokal**,
      # tanpa sinkronisasi tim. Itu kegagalan paling sulit dilihat yang bisa
      # dihasilkan pipeline ini: tidak ada error, halamannya normal, dan angka
      # yang diketik satu orang tidak pernah sampai ke yang lain. Jadi ia
      # diperiksa di sini, bukan ditemukan seminggu kemudian di rapat.
      # ⚠️ Yang dicari NILAI VARIABELNYA, bukan kata "supabase.co".
      #
      # Versi pertama langkah ini mencari string "supabase.co" di dalam bundle dan
      # LOLOS pada jalan CI pertama — padahal variables-nya belum diset sama
      # sekali. Sebabnya: pustaka `@supabase/supabase-js` yang ikut ter-bundle
      # memuat string itu di dalam kodenya sendiri. Pemeriksa yang mengaku
      # membuktikan "sinkronisasi tim aktif" hijau pada bundle yang justru tidak
      # punya kredensial — bentuk kegagalan yang paling sulit dilihat, di langkah
      # yang seluruh gunanya mencegah kegagalan yang sulit dilihat.
      - name: Bundle benar-benar membawa sinkronisasi tim
        env:
          URL_SUPABASE: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$URL_SUPABASE" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_SUPABASE_URL kosong. Bundle yang ter-deploy akan berjalan mode lokal: halamannya normal, tidak ada error, dan angka yang diketik satu orang tidak pernah sampai ke yang lain."
            echo "::error::Set NEXT_PUBLIC_SUPABASE_URL dan NEXT_PUBLIC_SUPABASE_ANON_KEY di Settings → Secrets and variables → Actions → Variables. Caranya di docs/CI-CD.md."
            exit 1
          fi

          if grep -rqF "$URL_SUPABASE" out/_next/static; then
            echo "ok  URL project ada di dalam bundle — sinkronisasi tim aktif"
          else
            echo "::error::NEXT_PUBLIC_SUPABASE_URL diset tapi TIDAK ikut ter-bundle. Biasanya berarti next.config.ts atau env.ts berubah dan variabelnya tidak lagi dibaca saat build."
            exit 1
          fi

      # Penanda versi. Dibaca job `kirim` untuk membuktikan bundle INI yang
      # terbit — bukan sekadar "halamannya 200", yang sudah benar sebelum deploy
      # juga dan karena itu tidak membuktikan apa pun.
      - name: Cap versi
        run: echo "${GITHUB_SHA}" > out/versi-ci.txt

      # Skrip keepalive yang dipanggil cron Hostinger, ikut dikirim bersama
      # bundle. Ia ada karena cron Hostinger membatasi perintahnya 255 karakter
      # dan anon key sendiri sudah ~220 — `curl` lengkap tidak muat di satu
      # baris crontab, jadi barisnya cuma memanggil berkas ini.
      #
      # ⚠️ DIBANGKITKAN di sini, bukan dikomit. Menuliskan anon key ke dalam
      # berkas repo akan membatalkan alasan `env.ts` dibuat: memutar kunci
      # berarti menyunting kode, dan cabang uji coba berarti menyunting berkas
      # yang sama yang dipakai tim. Dari sini, memutar kunci = ganti repository
      # variable lalu deploy ulang — persis jalur yang sudah berlaku untuk
      # kredensial di dalam bundle.
      #
      # ⛔ HANYA MEMBACA. Tidak ada -X, tidak ada --data, tidak ada upsert.
      # Ia jalan otomatis tiap hari tanpa ada yang menonton; kalau ia menulis,
      # ia menulis ratusan kali setahun ke dokumen tim tanpa satu pun log merah.
      # Dijaga `npm run probe:jaga`, yang menyisir blok di bawah ini.
      #
      # `%` aman di sini — pelarian `%` hanya berlaku pada baris crontab, bukan
      # di dalam berkas skrip yang dipanggilnya.
      - name: Bangkitkan skrip keepalive
        env:
          URL_SUPABASE: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ID_DOKUMEN: ${{ vars.NEXT_PUBLIC_DOKUMEN_ID }}
        run: |
          ID_DOK="${ID_DOKUMEN:-sos-unit-economics}"
          cat > out/jaga-supabase.sh <<SKRIP
          #!/bin/sh
          # Dibangkitkan CI dari repository variables. Jangan disunting di server:
          # deploy berikutnya menimpanya. Sumbernya .github/workflows/ci.yml.
          KEY="$ANON"
          URL="$URL_SUPABASE"
          ID="$ID_DOK"
          LOG="\$HOME/jaga-supabase.log"
          CAP="\$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if curl -fsS -m 30 -o /dev/null -H "apikey: \$KEY" -H "Authorization: Bearer \$KEY" "\$URL/rest/v1/unit_economics?id=eq.\$ID&select=id"; then
            echo "OK \$CAP" >> "\$LOG"
          else
            echo "GAGAL \$CAP" >> "\$LOG"
          fi
          tail -n 400 "\$LOG" > "\$LOG.tmp" && mv "\$LOG.tmp" "\$LOG"
          SKRIP
          chmod +x out/jaga-supabase.sh
          echo "--- skrip yang dihasilkan (kunci disamarkan) ---"
          sed "s|$ANON|<ANON_KEY>|g" out/jaga-supabase.sh

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 3

  # ─────────────────────────────────────────────────────────── 3. layar ──
  layar:
    name: Probe browser
    runs-on: ubuntu-latest
    needs: [bundel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium

      - name: Sajikan bundle
        run: npm run serve:build &

      # Bukan sekadar menunggu: ia menuntut halaman ngawur menjawab 404 dan path
      # tanpa basePath menjawab 404. Server yang menjawab 200 untuk apa pun
      # membuat SELURUH probe layar di atasnya tidak bermakna — ia akan lulus
      # untuk halaman yang mati setelah deploy.
      - name: Tunggu server, lalu buktikan ia jujur
        run: npm run tunggu:server

      - name: Probe layar
        run: npm run probe:layar

  # ─────────────────────────────────────────────────────────── 4. kirim ──
  kirim:
    name: Kirim ke abbas.co.id/perfume
    runs-on: ubuntu-latest
    needs: [cepat, bundel, layar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: produksi
    timeout-minutes: 15
    steps:
      - name: Secret ada?
        env:
          TOKEN: ${{ secrets.PORTFOLIO_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PORTFOLIO_PUSH_TOKEN belum diset. Lihat docs/CI-CD.md untuk cara membuatnya."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Checkout repo portfolio
        uses: actions/checkout@v4
        with:
          repository: abbas2610/personal-project-portofolio
          ref: main
          token: ${{ secrets.PORTFOLIO_PUSH_TOKEN }}
          path: portfolio
          fetch-depth: 1

      # `--delete` disengaja: berkas yang sudah tidak dihasilkan build harus ikut
      # hilang. Tanpa itu, halaman yang dihapus tetap hidup di produksi.
      #
      # Yang TIDAK boleh tersentuh: apa pun di luar public/perfume-app/. Satu
      # domain menampung beberapa aplikasi, dan tetangganya diperiksa di bawah.
      - name: Salin bundle ke public/perfume-app/
        run: |
          mkdir -p portfolio/public/perfume-app
          rsync -a --delete out/ portfolio/public/perfume-app/
          echo "$(find portfolio/public/perfume-app -type f | wc -l) berkas di public/perfume-app/"

      - name: Commit dan push
        working-directory: portfolio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/perfume-app

          if git diff --cached --quiet; then
            echo "Bundle identik dengan yang sudah live — tidak ada yang dikirim."
            exit 0
          fi

          git commit -m "Perbarui bundle Unit Economics dari CI" \
            -m "Dibangun dari unit_economics@${GITHUB_SHA:0:7} setelah lint, typecheck, dan seluruh probe lolos." \
            -m "Push ini memicu webhook Hostinger, jadi abbas.co.id/perfume ikut berubah."
          git push origin main

      # Yang dipercaya bukan "push berhasil" tapi halamannya benar-benar hidup.
      - name: Buktikan situsnya hidup
        run: |
          # Polling, bukan `sleep`. Prinsip yang sama dengan tunggu-server.mjs:
          # tidur 25 detik membuang waktu saat webhook cepat, dan TETAP gagal
          # palsu saat ia lambat. Yang ditunggu penanda versi yang SAMA DENGAN
          # commit ini — bukan sekadar 200, yang sudah benar sebelum deploy juga.
          echo "Menunggu bundle $GITHUB_SHA terbit…"
          terbit=0
          for i in $(seq 1 60); do
            live=$(curl -s "https://abbas.co.id/perfume-app/versi-ci.txt?cb=$GITHUB_RUN_ID-$i" | tr -d "[:space:]")
            if [ "$live" = "$GITHUB_SHA" ]; then terbit=1; break; fi
            sleep 5
          done
          if [ "$terbit" != "1" ]; then
            echo "::error::Setelah $i polling, /perfume-app/versi-ci.txt masih \"$live\", bukan $GITHUB_SHA."
            echo "::error::Kalau ini menetap: cache website di hPanel biasanya penyebabnya."
            exit 1
          fi
          echo "Bundle ini yang live, terbit setelah $i polling"

          gagal=0

          # Pintu yang dipakai orang adalah /perfume/, yang mem-iframe bundle ini.
          for u in "/perfume/" "/perfume-app/index.html" "/perfume-app/unit-economics/index.html"; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "https://abbas.co.id$u?cb=$GITHUB_RUN_ID")
            echo "$kode  $u"
            [ "$kode" = "200" ] || gagal=1
          done

          # ⚠️ Path-nya menyebut index.html, dan itu BUKAN kelalaian. Bundle ini
          # tinggal di public/ aplikasi Next milik repo portfolio, dan Next
          # menyajikan berkas public/ hanya pada path PERSISNYA — tidak ada
          # directory index. Diukur di produksi: /perfume-app/index.html → 200,
          # /perfume-app/ → 404. Lihat docs/INFRASTRUKTUR.md.

          # Regresi tetangga: satu domain, beberapa aplikasi. Deploy portfolio
          # menimpa public/, jadi yang lain wajib ikut diperiksa.
          for u in "/" "/sm/" "/whitespace/"; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "https://abbas.co.id$u?cb=$GITHUB_RUN_ID")
            echo "$kode  $u  (tetangga)"
            [ "$kode" = "200" ] || gagal=1
          done

          # Kontrol negatif: server yang menjawab 200 untuk apa pun juga lulus
          # semua baris di atas.
          kode=$(curl -s -o /dev/null -w '%{http_code}' "https://abbas.co.id/perfume-app/ngawur-xyz/")
          echo "$kode  /perfume-app/ngawur-xyz/  (harus 404)"
          [ "$kode" = "404" ] || gagal=1

          exit $gagal
